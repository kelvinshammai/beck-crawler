<header>

  <p class="sub" id="headerSub">{{HEADER_SUB}}</p>
</header>

<div class="controls">
  <input id="search" type="search" placeholder="Buscar por nome…" autocomplete="off" />
  <div class="sort-menu">
    <button class="filters-toggle" id="sortToggle" aria-expanded="false" aria-haspopup="listbox">
      <span class="control-icon" aria-hidden="true">↕️</span> <span id="sortToggleLabel">Padrão (categoria + nome)</span> <span class="chevron" aria-hidden="true">▾</span>
    </button>
    <div class="filters-panel sort-panel" id="sortPanel" style="display:none" role="listbox" aria-label="Ordenar por">
      <button class="sort-option" data-value="default" aria-selected="true" role="option">Padrão (categoria + nome)</button>
      <button class="sort-option" data-value="name-asc" role="option">Nome (A→Z)</button>
      <button class="sort-option" data-value="name-desc" role="option">Nome (Z→A)</button>
      <button class="sort-option" data-value="thc-asc" role="option">THC (menor→maior)</button>
      <button class="sort-option" data-value="thc-desc" role="option">THC (maior→menor)</button>
      <button class="sort-option" data-value="price-asc" role="option">Preço (menor→maior)</button>
      <button class="sort-option" data-value="price-desc" role="option">Preço (maior→menor)</button>
    </div>
  </div>
  <div class="filters-menu">
    <button class="filters-toggle" id="filtersToggle" aria-expanded="false">
      <span class="control-icon" aria-hidden="true">🏷️</span> Filtros <span class="filters-count" id="filtersCount" style="display:none">0</span> <span class="chevron">▾</span>
    </button>
    <div class="filters-panel" id="filtersPanel" style="display:none">
      <div class="filter-group">
        <div class="filter-group-label">🏷️ Tipo</div>
        <div class="checkbox-list" id="categoryFilter"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">✅ Disponibilidade</div>
        <div class="checkbox-list" id="availabilityFilter"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">👃 Aroma</div>
        <div class="checkbox-list" id="aromaFilter"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">🌱 Cultivo</div>
        <div class="checkbox-list" id="growFilter"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">🔥 Potência</div>
        <div class="checkbox-list" id="potencyFilter"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">💭 Sensação</div>
        <div class="checkbox-list" id="sensationFilter"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">🧪 Terpeno</div>
        <div class="checkbox-list" id="terpeneFilter"></div>
      </div>
      <button class="filters-clear" id="filtersClear">Limpar filtros</button>
    </div>
  </div>
</div>

<p class="count" id="count"></p>

<main id="grid"></main>

<footer id="footerNote">{{FOOTER_NOTE}}</footer>

<dialog id="modal">
  <div class="modal-body" id="modalBody">
    <div class="modal-topbar">
      <span class="modal-position" id="modalPosition"></span>
      <button class="x-close" id="modalXClose" aria-label="Fechar">✕</button>
    </div>
    <div class="modal-columns">
      <div class="modal-col-left">
        <div class="modal-media-row">
          <div class="modal-media">
            <img class="modal-img" id="modalImg" alt="" />
            <div class="modal-img placeholder" id="modalPlaceholder" style="display:none"></div>
            <button class="gallery-arrow prev" id="modalGalleryPrev" aria-label="Imagem anterior" style="display:none">‹</button>
            <button class="gallery-arrow next" id="modalGalleryNext" aria-label="Próxima imagem" style="display:none">›</button>
            <div class="gallery-dots" id="modalGalleryDots" style="display:none"></div>
          </div>
        </div>
        <h2 id="modalName"></h2>
        <div class="modal-price" id="modalPrice"></div>
        <div class="lineage-subtitle" id="modalLineage" style="display:none"></div>
        <div class="last-seen" id="modalLastSeen" style="display:none"></div>
      </div>
      <div class="modal-col-right">
        <div class="modal-scroll" id="modalScroll"></div>
      </div>
    </div>
    <div class="modal-footer-nav">
      <button class="footer-nav-btn prev" id="modalPrev" aria-label="Item anterior">‹ Anterior</button>
      <button class="footer-nav-btn next" id="modalNext" aria-label="Próximo item">Próximo ›</button>
    </div>
  </div>
</dialog>

<dialog id="lightbox">
  <img id="lightboxImg" alt="" />
  <button class="gallery-arrow prev lightbox-arrow" id="lightboxPrev" aria-label="Imagem anterior">‹</button>
  <button class="gallery-arrow next lightbox-arrow" id="lightboxNext" aria-label="Próxima imagem">›</button>
  <button class="x-close" id="lightboxClose" aria-label="Fechar imagem ampliada">✕</button>
</dialog>

<script id="products-data" type="application/json">
[]
</script>
<script id="category-meta-data" type="application/json">
{}
</script>
<script>
  // PRODUCTS and CATEGORY_META are data, not code — a Python script (see
  // catalog.py's load_products/save_products) reads/writes the JSON blocks
  // above directly, so this page's logic never needs a JS object-literal
  // parser and stays association-agnostic. Everything below only reads
  // fields defensively (checks `if (p.thc != null)` etc.) so an association
  // whose bot exposes less detail than ABECMED's still renders fine with
  // sparser cards — see SKILL.md's "Generating the HTML catalog page" for
  // the full field schema and which fields are optional.
  const PRODUCTS = JSON.parse(document.getElementById("products-data").textContent);
  // Optional {categoryKey: {label, icon}} overrides — falls back to a
  // generic label/icon per category when a key isn't present here.
  const CATEGORY_META = JSON.parse(document.getElementById("category-meta-data").textContent);

  function thcTier(thc) {
    if (thc == null) return null;
    if (thc < 18) return { n: 1, word: "Suave" };
    if (thc <= 24) return { n: 2, word: "Moderado" };
    return { n: 3, word: "Potente" };
  }

  function ratioDominance(ratio) {
    if (!ratio) return null;
    if (ratio.sativa >= 60) return { word: "Sativa", tone: "sativa" };
    if (ratio.indica >= 60) return { word: "Indica", tone: "indica" };
    return { word: "Híbrida equilibrada", tone: "neutral" };
  }

  const TERPENE_ICONS = {
    "Mirceno": "🌿", "Limoneno": "🍋", "Cariofileno": "🌶️", "Pineno": "🌲",
    "Terpinoleno": "🌸", "Humuleno": "🌾"
  };
  const EFFECT_ICONS = {
    "Euforia": "😊", "Euforia leve": "😊", "Euforia intensa": "😊",
    "Relaxamento": "😌", "Relaxamento leve": "😌", "Relaxamento equilibrado": "😌",
    "Relaxamento corporal": "😌", "Relaxamento corporal intenso": "😌", "Relaxamento duradouro": "😌",
    "Energia": "⚡", "Criatividade": "🎨", "Foco": "🎯",
    "Felicidade": "😄", "Bem-estar": "💚", "Bem-estar duradouro": "💚",
    "Estímulo mental": "🧠", "Efeito calmante duradouro": "😴"
  };

  const grid = document.getElementById("grid");
  const countEl = document.getElementById("count");
  const searchInput = document.getElementById("search");
  let currentList = [];
  let currentIndex = -1;

  // Category order/labels/icons are derived from the data itself instead of
  // a hardcoded flor/concentrado map — this is what makes the same template
  // work for an association whose bot offers different categories.
  const CATEGORY_ORDER = {};
  PRODUCTS.forEach(p => {
    if (!(p.category in CATEGORY_ORDER)) CATEGORY_ORDER[p.category] = Object.keys(CATEGORY_ORDER).length;
  });

  function categoryLabel(category) {
    return (CATEGORY_META[category] && CATEGORY_META[category].label) || category || "Outro";
  }

  function iconFor(category) {
    return (CATEGORY_META[category] && CATEGORY_META[category].icon) || "📦";
  }

  function searchHaystack(p) {
    return [p.name, p.lineage, p.grow, p.note, ...(p.formTags || []), ...(p.terpenes || []), ...(p.sensation || []), ...(p.aromas || [])]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();
  }

  let activeSort = "default";
  const activeTagFilters = { category: [], grow: [], terpene: [], sensation: [], aroma: [], availability: [], potency: [] };

  function priceValue(p) {
    const m = (p.price || "").match(/([\d.,]+)/);
    if (!m) return NaN;
    return parseFloat(m[1].replace(/\./g, "").replace(",", "."));
  }

  function byNameAsc(a, b) {
    return a.name.localeCompare(b.name, "pt-BR");
  }

  function byCategory(a, b) {
    return (CATEGORY_ORDER[a.category] ?? 99) - (CATEGORY_ORDER[b.category] ?? 99);
  }

  // Every sort mode groups by category first, then applies its own
  // criterion, then falls back to alphabetical order — never a raw global
  // sort that mixes categories.
  function withCategoryGrouping(criterionFn) {
    return (a, b) => byCategory(a, b) || criterionFn(a, b) || byNameAsc(a, b);
  }

  const CRITERIA = {
    default: () => 0,
    "name-asc": byNameAsc,
    "name-desc": (a, b) => b.name.localeCompare(a.name, "pt-BR"),
    "thc-asc": (a, b) => {
      if (a.thc == null && b.thc == null) return 0;
      if (a.thc == null) return 1;
      if (b.thc == null) return -1;
      return a.thc - b.thc;
    },
    "thc-desc": (a, b) => {
      if (a.thc == null && b.thc == null) return 0;
      if (a.thc == null) return 1;
      if (b.thc == null) return -1;
      return b.thc - a.thc;
    },
    "price-asc": (a, b) => {
      const pa = priceValue(a), pb = priceValue(b);
      if (isNaN(pa) && isNaN(pb)) return 0;
      if (isNaN(pa)) return 1;
      if (isNaN(pb)) return -1;
      return pa - pb;
    },
    "price-desc": (a, b) => {
      const pa = priceValue(a), pb = priceValue(b);
      if (isNaN(pa) && isNaN(pb)) return 0;
      if (isNaN(pa)) return 1;
      if (isNaN(pb)) return -1;
      return pb - pa;
    }
  };

  const SORTERS = Object.fromEntries(
    Object.entries(CRITERIA).map(([key, fn]) => [key, withCategoryGrouping(fn)])
  );

  function matchesAny(selected, values) {
    if (!selected.length) return true;
    return selected.some(v => values.includes(v));
  }

  function matchesTagFilters(p) {
    if (activeTagFilters.category.length && !activeTagFilters.category.includes(p.category)) return false;
    if (activeTagFilters.grow.length && !activeTagFilters.grow.includes(p.grow)) return false;
    const availabilityKey = p.available === false ? "indisponivel" : "disponivel";
    if (activeTagFilters.availability.length && !activeTagFilters.availability.includes(availabilityKey)) return false;
    const tier = thcTier(p.thc);
    if (activeTagFilters.potency.length && (!tier || !activeTagFilters.potency.includes(tier.word))) return false;
    if (!matchesAny(activeTagFilters.terpene, p.terpenes || [])) return false;
    if (!matchesAny(activeTagFilters.sensation, p.sensation || [])) return false;
    if (!matchesAny(activeTagFilters.aroma, p.aromas || [])) return false;
    return true;
  }

  function getFiltered() {
    const q = searchInput.value.trim().toLowerCase();
    return PRODUCTS.filter(p => {
      const matchesQuery = !q || searchHaystack(p).includes(q);
      const matchesTag = matchesTagFilters(p);
      return matchesQuery && matchesTag;
    }).sort(SORTERS[activeSort]);
  }

  function tagRow(items, iconMap) {
    if (!items || !items.length) return "";
    return `<div class="chip-row">${items.map(t => {
      const icon = iconMap && iconMap[t] ? iconMap[t] + " " : "";
      return `<span class="tag">${icon}${t}</span>`;
    }).join("")}</div>`;
  }

  function ratioMeterSmall(ratio) {
    if (!ratio) return "";
    const dom = ratioDominance(ratio);
    return `
      <div class="ratio-meter" title="${ratio.sativa}% Sativa / ${ratio.indica}% Indica">
        <div class="split-track">
          <div class="sativa-seg" style="width:${ratio.sativa}%"></div>
          <div class="indica-seg" style="width:${ratio.indica}%"></div>
        </div>
        <span class="dominance-chip tone-${dom.tone}">${dom.word}</span>
      </div>`;
  }

  function buildModalScroll(p) {
    const tier = thcTier(p.thc);
    const parts = [];

    const statParts = [];
    if (p.thc != null) {
      statParts.push(`
        <div class="stat-tile">
          <div class="stat-value">${p.thc}%${tier ? `<span class="tier-word tier-pill tier-${tier.n}">${tier.word}</span>` : ""}</div>
          <div class="stat-label">THC</div>
        </div>`);
    }
    if (p.cbd) {
      statParts.push(`
        <div class="stat-tile stat-tile-cbd">
          <div class="stat-value">${p.cbd}</div>
          <div class="stat-label">CBD</div>
        </div>`);
    }
    if (p.ratio) {
      statParts.push(`
        <div class="ratio-tile">
          <div class="ratio-label">Sativa / Indica</div>
          <div class="split-track">
            <div class="sativa-seg" style="width:${p.ratio.sativa}%"></div>
            <div class="indica-seg" style="width:${p.ratio.indica}%"></div>
          </div>
          <div class="ratio-values"><span class="s-label">${p.ratio.sativa}% Sativa</span><span class="i-label">${p.ratio.indica}% Indica</span></div>
        </div>`);
    }
    if (statParts.length) parts.push(`<div class="stat-row">${statParts.join("")}</div>`);

    const labStatParts = [];
    if (p.moisture) {
      labStatParts.push(`
        <div class="stat-tile stat-tile-cbd">
          <div class="stat-value">${p.moisture}</div>
          <div class="stat-label">Moisture</div>
        </div>`);
    }
    if (p.waterActivity != null) {
      labStatParts.push(`
        <div class="stat-tile stat-tile-cbd">
          <div class="stat-value">${p.waterActivity}</div>
          <div class="stat-label">Water activity</div>
        </div>`);
    }
    if (labStatParts.length) parts.push(`<div class="stat-row">${labStatParts.join("")}</div>`);

    if (p.terpenes && p.terpenes.length) {
      parts.push(`<div><div class="section-label">Terpenos</div>${tagRow(p.terpenes, TERPENE_ICONS)}</div>`);
    }
    if (p.sensation && p.sensation.length) {
      parts.push(`<div><div class="section-label">Sensação</div>${tagRow(p.sensation, EFFECT_ICONS)}</div>`);
    }
    if (p.aromas && p.aromas.length) {
      parts.push(`<div><div class="section-label">Aromas</div>${tagRow(p.aromas)}</div>`);
    }
    const cultivoTags = [p.grow, ...(p.formTags || [])].filter(Boolean);
    if (cultivoTags.length) {
      parts.push(`<div><div class="section-label">Cultivo / Extração</div>${tagRow(cultivoTags)}</div>`);
    }
    if (p.note) {
      parts.push(`<div class="lineage">${p.note}</div>`);
    }

    return parts.join("");
  }

  function render() {
    const filtered = getFiltered();
    currentList = filtered;
    if (modal.open) modal.close();

    countEl.textContent = filtered.length + (filtered.length === 1 ? " produto encontrado" : " produtos encontrados");
    grid.innerHTML = "";

    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nenhum produto encontrado para essa busca.";
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(p => {
      const card = document.createElement("div");
      card.className = "card" + (p.available === false ? " unavailable" : "");
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "Ver detalhes de " + p.name);

      const thumb = document.createElement("div");
      thumb.className = "thumb" + (p.img ? "" : " placeholder");
      if (p.img) {
        const img = document.createElement("img");
        img.src = p.img;
        img.alt = p.name;
        img.loading = "lazy";
        thumb.appendChild(img);
      } else {
        thumb.textContent = iconFor(p.category);
      }
      const tier = thcTier(p.thc);
      const badge = document.createElement("span");
      if (p.available === false) {
        badge.className = "badge badge-unavailable";
        badge.textContent = "Indisponível";
      } else if (tier) {
        badge.className = "thc-badge tier-" + tier.n;
        badge.textContent = "THC " + p.thc + "%";
      } else {
        badge.className = "badge";
        badge.textContent = p.cannabinoid || categoryLabel(p.category);
      }
      thumb.appendChild(badge);

      const topTerpenes = (p.terpenes || []).slice(0, 2);
      const moreCount = (p.terpenes || []).length - topTerpenes.length;
      const cultivoBits = [p.grow, ...(p.formTags || [])].filter(Boolean);
      const metaBits = [
        ratioMeterSmall(p.ratio),
        cultivoBits.length ? `<div class="chip-row">${cultivoBits.map(t => `<span class="tag">${t}</span>`).join("")}</div>` : "",
        topTerpenes.length ? `<div class="chip-row">${topTerpenes.map(t => `<span class="tag">${t}</span>`).join("")}${moreCount > 0 ? `<span class="tag">+${moreCount}</span>` : ""}</div>` : ""
      ].filter(Boolean).join("");

      const body = document.createElement("div");
      body.className = "body";
      body.innerHTML = `
        <h3>${p.name}</h3>
        <div class="price">${p.price}</div>
        <div class="meta-row">${metaBits}</div>
      `;

      card.appendChild(thumb);
      card.appendChild(body);
      card.addEventListener("click", () => openModal(filtered.indexOf(p)));
      card.addEventListener("keypress", (e) => { if (e.key === "Enter") openModal(filtered.indexOf(p)); });

      grid.appendChild(card);
    });
  }

  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  const modalPlaceholder = document.getElementById("modalPlaceholder");
  const modalName = document.getElementById("modalName");
  const modalPrice = document.getElementById("modalPrice");
  const modalLineage = document.getElementById("modalLineage");
  const modalLastSeen = document.getElementById("modalLastSeen");
  const modalScroll = document.getElementById("modalScroll");
  const modalPrev = document.getElementById("modalPrev");
  const modalNext = document.getElementById("modalNext");
  const modalPosition = document.getElementById("modalPosition");
  const modalGalleryDots = document.getElementById("modalGalleryDots");
  const modalGalleryPrev = document.getElementById("modalGalleryPrev");
  const modalGalleryNext = document.getElementById("modalGalleryNext");
  document.getElementById("modalXClose").addEventListener("click", () => modal.close());
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.close(); });

  let galleryImages = [];
  let galleryIdx = 0;

  function showGalleryImage(idx, alt) {
    galleryIdx = idx;
    modalImg.src = galleryImages[idx];
    modalImg.alt = alt;
    modalImg.style.display = "block";
    modalPlaceholder.style.display = "none";
    modalGalleryDots.querySelectorAll("button").forEach((btn, i) => {
      btn.classList.toggle("active", i === idx);
    });
    modalGalleryPrev.disabled = idx <= 0;
    modalGalleryNext.disabled = idx >= galleryImages.length - 1;
    if (lightbox.open) {
      lightboxImg.src = galleryImages[idx];
      lightboxImg.alt = alt;
      lightboxPrev.disabled = idx <= 0;
      lightboxNext.disabled = idx >= galleryImages.length - 1;
    }
  }

  modalGalleryPrev.addEventListener("click", () => { if (galleryIdx > 0) showGalleryImage(galleryIdx - 1, modalImg.alt); });
  modalGalleryNext.addEventListener("click", () => { if (galleryIdx < galleryImages.length - 1) showGalleryImage(galleryIdx + 1, modalImg.alt); });

  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxPrev = document.getElementById("lightboxPrev");
  const lightboxNext = document.getElementById("lightboxNext");
  modalImg.addEventListener("click", () => {
    lightboxImg.src = modalImg.src;
    lightboxImg.alt = modalImg.alt;
    const showArrows = galleryImages.length > 1;
    lightboxPrev.style.display = showArrows ? "flex" : "none";
    lightboxNext.style.display = showArrows ? "flex" : "none";
    lightboxPrev.disabled = galleryIdx <= 0;
    lightboxNext.disabled = galleryIdx >= galleryImages.length - 1;
    lightbox.showModal();
  });
  lightboxPrev.addEventListener("click", () => { if (galleryIdx > 0) showGalleryImage(galleryIdx - 1, lightboxImg.alt); });
  lightboxNext.addEventListener("click", () => { if (galleryIdx < galleryImages.length - 1) showGalleryImage(galleryIdx + 1, lightboxImg.alt); });
  document.getElementById("lightboxClose").addEventListener("click", () => lightbox.close());
  lightbox.addEventListener("click", (e) => { if (e.target === lightbox) lightbox.close(); });
  lightbox.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" && galleryIdx > 0) showGalleryImage(galleryIdx - 1, lightboxImg.alt);
    if (e.key === "ArrowRight" && galleryIdx < galleryImages.length - 1) showGalleryImage(galleryIdx + 1, lightboxImg.alt);
  });

  function populateDetail(p) {
    galleryImages = [p.img, p.infoImg].filter(Boolean);
    if (galleryImages.length) {
      modalGalleryDots.innerHTML = galleryImages.map((_, i) =>
        `<button aria-label="${i === 0 ? 'Foto do produto' : 'Ficha técnica'}" data-idx="${i}"></button>`
      ).join("");
      const showNav = galleryImages.length > 1;
      modalGalleryDots.style.display = showNav ? "flex" : "none";
      modalGalleryPrev.style.display = showNav ? "flex" : "none";
      modalGalleryNext.style.display = showNav ? "flex" : "none";
      modalGalleryDots.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => showGalleryImage(parseInt(btn.dataset.idx, 10), p.name));
      });
      showGalleryImage(0, p.name);
    } else {
      modalImg.removeAttribute("src");
      modalImg.style.display = "none";
      modalPlaceholder.style.display = "flex";
      modalPlaceholder.textContent = iconFor(p.category);
      modalGalleryDots.style.display = "none";
      modalGalleryDots.innerHTML = "";
      modalGalleryPrev.style.display = "none";
      modalGalleryNext.style.display = "none";
    }
    modalName.textContent = p.name;
    modalPrice.textContent = [p.price, p.cannabinoid].filter(Boolean).join(" · ");
    if (p.lineage) {
      modalLineage.textContent = p.lineage;
      modalLineage.style.display = "block";
    } else {
      modalLineage.style.display = "none";
    }
    if (p.lastSeenAvailable) {
      modalLastSeen.textContent = "Visto disponível pela última vez em " + p.lastSeenAvailable;
      modalLastSeen.style.display = "block";
    } else {
      modalLastSeen.style.display = "none";
    }
    modalScroll.innerHTML = buildModalScroll(p);
    modalPosition.textContent = (currentIndex + 1) + " / " + currentList.length;
    modalPrev.disabled = currentIndex <= 0;
    modalNext.disabled = currentIndex >= currentList.length - 1;
  }

  function openModal(index) {
    currentIndex = index;
    const p = currentList[currentIndex];
    if (!p) return;
    populateDetail(p);
    if (!modal.open) modal.showModal();
  }

  function navigate(delta) {
    const next = currentIndex + delta;
    if (next < 0 || next >= currentList.length) return;
    openModal(next);
  }

  modalPrev.addEventListener("click", () => navigate(-1));
  modalNext.addEventListener("click", () => navigate(1));
  modal.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") navigate(-1);
    if (e.key === "ArrowRight") navigate(1);
  });

  const sortToggle = document.getElementById("sortToggle");
  const sortToggleLabel = document.getElementById("sortToggleLabel");
  const sortPanel = document.getElementById("sortPanel");
  const sortOptions = Array.from(sortPanel.querySelectorAll(".sort-option"));

  sortToggle.addEventListener("click", () => {
    const isOpen = sortPanel.style.display !== "none";
    sortPanel.style.display = isOpen ? "none" : "flex";
    sortToggle.setAttribute("aria-expanded", String(!isOpen));
  });

  sortOptions.forEach(btn => {
    btn.addEventListener("click", () => {
      activeSort = btn.dataset.value;
      sortToggleLabel.textContent = btn.textContent;
      sortOptions.forEach(b => b.setAttribute("aria-selected", String(b === btn)));
      sortPanel.style.display = "none";
      sortToggle.setAttribute("aria-expanded", "false");
      render();
    });
  });

  function uniqueSorted(values) {
    return Array.from(new Set(values.filter(Boolean))).sort((a, b) => a.localeCompare(b, "pt-BR"));
  }

  function populateFilterCheckboxes(containerEl, key, valueLabelPairs) {
    if (!valueLabelPairs.length) {
      containerEl.innerHTML = '<span class="empty-note">Nenhum valor disponível</span>';
      return;
    }
    containerEl.innerHTML = valueLabelPairs.map(([value, label]) => `
      <label>
        <input type="checkbox" value="${value}" data-key="${key}">
        ${label}
      </label>
    `).join("");
    containerEl.querySelectorAll("input").forEach(input => {
      input.addEventListener("change", () => {
        const arr = activeTagFilters[key];
        if (input.checked) {
          if (!arr.includes(input.value)) arr.push(input.value);
        } else {
          activeTagFilters[key] = arr.filter(v => v !== input.value);
        }
        updateFiltersCount();
        render();
      });
    });
  }

  const categoryFilter = document.getElementById("categoryFilter");
  const growFilter = document.getElementById("growFilter");
  const availabilityFilter = document.getElementById("availabilityFilter");
  const potencyFilter = document.getElementById("potencyFilter");
  const terpeneFilter = document.getElementById("terpeneFilter");
  const sensationFilter = document.getElementById("sensationFilter");
  const aromaFilter = document.getElementById("aromaFilter");

  // Category filter options are derived from the categories actually
  // present in PRODUCTS (in first-seen order), each labeled/iconed via
  // CATEGORY_META with a generic fallback — this is the piece that used to
  // be a hardcoded ["flor", "concentrado"] pair.
  populateFilterCheckboxes(
    categoryFilter, "category",
    Object.keys(CATEGORY_ORDER).map(c => [c, `${iconFor(c)} ${categoryLabel(c)}`])
  );
  populateFilterCheckboxes(availabilityFilter, "availability", [["disponivel", "✅ Disponível"], ["indisponivel", "🚫 Indisponível"]]);
  populateFilterCheckboxes(potencyFilter, "potency", [["Suave", "🟢 Suave"], ["Moderado", "🟠 Moderado"], ["Potente", "🔴 Potente"]]);
  populateFilterCheckboxes(growFilter, "grow", uniqueSorted(PRODUCTS.map(p => p.grow)).map(v => [v, v]));
  populateFilterCheckboxes(terpeneFilter, "terpene", uniqueSorted(PRODUCTS.flatMap(p => p.terpenes || [])).map(v => [v, v]));
  populateFilterCheckboxes(sensationFilter, "sensation", uniqueSorted(PRODUCTS.flatMap(p => p.sensation || [])).map(v => [v, v]));
  populateFilterCheckboxes(aromaFilter, "aroma", uniqueSorted(PRODUCTS.flatMap(p => p.aromas || [])).map(v => [v, v]));

  const filtersToggle = document.getElementById("filtersToggle");
  const filtersPanel = document.getElementById("filtersPanel");
  const filtersCount = document.getElementById("filtersCount");
  const filtersClear = document.getElementById("filtersClear");

  function updateFiltersCount() {
    const n = Object.values(activeTagFilters).reduce((sum, arr) => sum + arr.length, 0);
    filtersCount.textContent = n;
    filtersCount.style.display = n > 0 ? "inline" : "none";
  }

  filtersToggle.addEventListener("click", () => {
    const isOpen = filtersPanel.style.display !== "none";
    filtersPanel.style.display = isOpen ? "none" : "flex";
    filtersToggle.setAttribute("aria-expanded", String(!isOpen));
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest(".filters-menu") && filtersPanel.style.display !== "none") {
      filtersPanel.style.display = "none";
      filtersToggle.setAttribute("aria-expanded", "false");
    }
    if (!e.target.closest(".sort-menu") && sortPanel.style.display !== "none") {
      sortPanel.style.display = "none";
      sortToggle.setAttribute("aria-expanded", "false");
    }
  });

  filtersClear.addEventListener("click", () => {
    Object.keys(activeTagFilters).forEach(k => activeTagFilters[k] = []);
    filtersPanel.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
    updateFiltersCount();
    render();
  });

  searchInput.addEventListener("input", render);

  render();
</script>
